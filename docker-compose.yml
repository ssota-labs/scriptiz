# M5: 공유 `data` 볼륨. MCP는 컨테이너에선 stdio가 닫혀 `SCRIPTIZ_MCP_START_STDIO=0` + 헬스만 켤 수 있음.
# 로컬에서 같은 DATA_DIR로 MCP 서버를 띄워 도구 + MCP UI payload를 쓰는 흐름을 권장.
services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    environment:
      DATA_DIR: /app/data
      DEFAULT_TRANSCRIPT_LANGUAGE: ${DEFAULT_TRANSCRIPT_LANGUAGE:-ko}
      HEALTH_CHECK_PORT: "8080"
      # Docker detached 환경에서 stdio 없을 때
      SCRIPTIZ_MCP_START_STDIO: "0"
    ports:
      - "8080:8080"
    volumes:
      - scriptiz_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATA_DIR: /app/data
      DEFAULT_TRANSCRIPT_LANGUAGE: ${DEFAULT_TRANSCRIPT_LANGUAGE:-ko}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_STALE_JOB_AFTER_MS: ${WORKER_STALE_JOB_AFTER_MS:-1800000}
      YTDLP_TIMEOUT_MS: ${YTDLP_TIMEOUT_MS:-600000}
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-300000}
      STT_MAX_AUDIO_BYTES: ${STT_MAX_AUDIO_BYTES:-26214400}
      # M6: 자막 없을 때 STT — `STT_PROVIDER=openai|xai`, 키는 호스트 env에서 전달
      STT_PROVIDER: ${STT_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - scriptiz_data:/app/data
    depends_on:
      - mcp-server
    restart: unless-stopped

volumes:
  scriptiz_data:
